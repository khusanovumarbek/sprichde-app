# Render.com uchun — git push qilgandan keyin Render dashboard'da yangi Web Service yarating.
# Build/Start/env allaqachon shu yerda yozilgan; Render avtomatik o'qiydi.
services:
  - type: web
    name: sprichde-original
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python backend/server.py"
    envVars:
      - key: SPRICHDE_HOST
        value: 0.0.0.0
      - key: SPRICHDE_PORT
        value: 10000
      - key: SPRICHDE_OPEN
        value: none
