<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>SprichDe · 91 kunlik sayohat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="theme.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="application-name" content="SprichDe">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SprichDe">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<script src="pwa.js" defer></script>
<link rel="stylesheet" href="theme.css">
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;--blue:var(--primary);--blue-dark:var(--primary-2);--muted:#788196;--line:#e9ebf2;--soft:#e7efff;--shadow:0 10px 26px #1d2b4b0f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:20}
.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;text-decoration:none;color:var(--text)}
.topbar b{font-size:16px;font-weight:800}
.wrap{max-width:520px;margin:0 auto;padding:22px 20px 70px}
.intro{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.intro small{font-size:10.5px;font-weight:800;letter-spacing:2px;color:#ffffffcc}
.intro b{display:block;font-size:22px;font-weight:800;margin-top:6px}
.intro p{margin:6px 0 0;font-size:12.5px;color:#ffffffd9;line-height:1.6}
.j-count{display:inline-block;margin-top:12px;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:800}

/* ---------- KUNLAR XARITASI ---------- */
.map-wrap{position:relative;margin:6px -20px 0}
.map-svg{display:block;width:100%;height:100%}
.map-path{fill:none;stroke:#cde8d4;stroke-width:26;stroke-linecap:round;stroke-dasharray:2 30}
html[data-theme="dark"] .map-path{stroke:#24433a}
.day-node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;z-index:5}
.node-circle{width:56px;height:56px;border-radius:50%;border:3px solid #1d9a52;background:#e7f6ec;color:#1d9a52;font-size:15px;font-weight:800;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 14px #1d2b4b26;transition:transform .12s}
.node-circle:active{transform:scale(.92)}
.day-node.locked .node-circle{border-color:#e9ebf2;background:var(--surface-2);color:var(--muted);cursor:not-allowed;box-shadow:none}
.day-node.done .node-circle{border-color:#1d9a52}
.day-node.current .node-circle{border-color:#3157a4;background:var(--soft);color:var(--blue);box-shadow:0 0 0 5px #3157a433, 0 6px 14px #1d2b4b26}
.day-label{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.day-node.current .day-label{color:var(--blue)}
.day-node.done .day-label{color:#1d9a52}

.day-pop{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translate(-50%,8px);width:210px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;z-index:30;box-shadow:0 14px 34px #1d2b4b33;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.day-pop::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--surface)}
.day-node.open .day-pop{opacity:1;transform:translate(-50%,0)}
.day-pop b{display:block;font-size:13.5px;color:var(--blue);font-weight:800}
.day-pop span{display:block;font-size:11.5px;color:var(--text);margin-top:3px;font-weight:700}
.day-pop small{display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5}
.day-pop .lock-note{display:block;font-size:10.5px;color:#d2453c;font-weight:800;margin-top:6px}
.note{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.6;text-align:center}

@media (max-width:420px){
  .wrap{padding-left:14px;padding-right:14px}
  .map-wrap{margin-left:-14px;margin-right:-14px}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="app.html">‹</a>
  <b>91 kunlik sayohat</b>
</header>

<div class="wrap">
  <div class="intro">
    <small>SAYOHAT</small>
    <b>91 kunlik sayohat</b>
    <p>Har kuni bir qadam — katta natija sari. O‘tilgan kunlar ✓ yashil, keyingi kunlar kulrang yopiq.</p>
    <div class="j-count" id="journeyCount">0 / 91 kun</div>
  </div>

  <div class="map-wrap" id="mapWrap"></div>

  <p class="note">O‘tilgan kunlarni qayta ko‘rish uchun ✓ belgilangan doiralarni bosing.</p>
</div>

<script>
const TOTAL_DAYS = 91;
const LESSONS = [
  { de: 'Hallo', uz: 'Salom' },
  { de: 'Wie heißt du?', uz: 'Isming nima?' },
  { de: 'Danke', uz: 'Rahmat' },
  { de: 'das Wasser', uz: 'suv' },
  { de: 'Guten Morgen', uz: 'Xayrli tong' },
  { de: 'die Familie', uz: 'oila' },
  { de: 'gut', uz: 'yaxshi' },
  { de: 'der Kaffee', uz: 'kofe' },
  { de: 'die Frage', uz: 'savol' },
  { de: 'Entschuldigung', uz: 'kechirasiz' },
  { de: 'der Bahnhof', uz: 'stansiya / vokzal' },
  { de: 'das Wetter', uz: 'ob-havo' },
];

const wrap = document.getElementById('mapWrap');
const STEP = 92;
const TOP = 30;
const MAP_HEIGHT = TOP + TOTAL_DAYS * STEP + 40;
wrap.style.height = MAP_HEIGHT + 'px';

function nodePoint(i) {
  const t = i / 6.4;
  const x = 50 + Math.sin(t) * 29; // 21%..79%
  const y = TOP + i * STEP;
  return { x, y };
}

// SVG yo‘li
let d = '';
for (let i = 0; i < TOTAL_DAYS; i++) {
  const p = nodePoint(i);
  d += (i === 0 ? 'M' : ' L') + ` ${p.x.toFixed(2)} ${p.y.toFixed(1)}`;
}
const svg = `<svg class="map-svg" viewBox="0 0 100 ${MAP_HEIGHT}" preserveAspectRatio="none" aria-hidden="true"><path class="map-path" stroke-width="7" d="${d}"/></svg>`;
wrap.innerHTML = svg;

let completedDays = [];
function buildNodes() {
  wrap.querySelectorAll('.day-node').forEach((n) => n.remove());
  const nextDay = completedDays.length ? Math.max(...completedDays) + 1 : 1;
  for (let day = 1; day <= TOTAL_DAYS; day++) {
    const { x, y } = nodePoint(day - 1);
    const done = completedDays.includes(day);
    const current = day === nextDay;
    const locked = !done && !current;
    const lesson = LESSONS[(day - 1) % LESSONS.length];
    const node = document.createElement('div');
    node.className = 'day-node' + (done ? ' done' : '') + (locked ? ' locked' : '') + (current ? ' current' : '');
    node.style.left = x + '%';
    node.style.top = y + 'px';
    node.innerHTML = `
      <button class="node-circle" type="button" aria-label="${day}-kun">${done ? '✓' : day}</button>
      <span class="day-label">${day}-kun</span>
      <div class="day-pop" role="tooltip">
        <b>${lesson.de}</b>
        <span>— ${lesson.uz}</span>
        <small>${day}-kun${done ? ' · O‘tilgan ✓' : current ? ' · Navbatdagi dars' : ' · Hali ochilmagan'}</small>
        ${locked ? '<span class="lock-note">Hali ochilmagan</span>' : ''}
      </div>`;
    const circle = node.querySelector('.node-circle');
    circle.addEventListener('click', () => {
      const willOpen = !node.classList.contains('open');
      wrap.querySelectorAll('.day-node.open').forEach((n) => n.classList.remove('open'));
      if (willOpen) node.classList.add('open');
    });
    wrap.appendChild(node);
  }
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.day-node')) {
    wrap.querySelectorAll('.day-node.open').forEach((n) => n.classList.remove('open'));
  }
});

(async function initJourney() {
  const me = await guard('student');
  if (!me) return;
  try {
    const data = await authFetch('/api/progress');
    completedDays = Array.isArray(data.completedDays) ? data.completedDays : [];
    document.getElementById('journeyCount').textContent = completedDays.length + ' / ' + TOTAL_DAYS + ' kun';
  } catch {
    completedDays = [];
    document.getElementById('journeyCount').textContent = '0 / 91 kun';
  }
  buildNodes();
})();
</script>
</body>
</html>
