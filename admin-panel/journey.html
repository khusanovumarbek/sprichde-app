<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>SprichDe · 91 kunlik sayohat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="theme.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="application-name" content="SprichDe">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SprichDe">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<script src="pwa.js" defer></script>
<link rel="stylesheet" href="theme.css">
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;--blue:var(--primary);--blue-dark:var(--primary-2);--muted:#788196;--line:#e9ebf2;--soft:#e7efff;--shadow:0 10px 26px #1d2b4b0f;--green:#25a368;--green-dark:#1d8a54;--green-soft:#cde8d4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:20}
.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;text-decoration:none;color:var(--text)}
.topbar b{font-size:16px;font-weight:800}
.wrap{max-width:520px;margin:0 auto;padding:18px 20px 80px}

/* ---------- PROGRESS KARTA ---------- */
.intro{position:relative;background:linear-gradient(150deg,#243f7a 0%,#2c4e94 55%,#33589f 100%);border-radius:22px;padding:22px 20px 18px;color:#fff;box-shadow:var(--shadow);overflow:hidden}
.intro::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:#3157a422}
.intro small{display:block;font-size:10.5px;font-weight:800;letter-spacing:2.5px;color:#ffffffcc;position:relative}
.intro b{display:block;font-size:23px;font-weight:800;margin-top:4px;position:relative}
.intro-grid{display:flex;align-items:center;gap:16px;margin-top:14px;position:relative}
.ring-wrap{position:relative;flex:none;width:84px;height:84px}
.ring-bg{stroke:#ffffff2e}
.ring-fg{stroke:#ffd23e;transition:stroke-dashoffset .5s ease;transform:rotate(-90deg);transform-origin:50% 50%}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;line-height:1}
.ring-label b{display:block;font-size:18px;font-weight:800;line-height:1}
.ring-label small{font-size:9px;font-weight:700;letter-spacing:.4px;color:#ffffffcc;line-height:1}
.intro-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.stat-box{background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.stat-box small{font-size:10px;font-weight:700;letter-spacing:.4px;color:#ffffffaa}
.stat-box b{display:block;font-size:16px;font-weight:800;margin-top:2px}
.stat-box span{font-size:11px;color:#ffffffaa}

/* ---------- KUNLAR XARITASI ---------- */
.map-wrap{position:relative;margin:16px -20px 0}
.map-svg{display:block;width:100%;height:100%}
.map-path{fill:none;stroke:var(--green-soft);stroke-width:32;stroke-linecap:round;stroke-dasharray:2 30}
.map-path-dots{fill:none;stroke:#ffffff;stroke-width:5;stroke-linecap:round;stroke-dasharray:0.1 26}
html[data-theme="dark"] .map-path{stroke:#20412e}
html[data-theme="dark"] .map-path-dots{stroke:#2d5a3d}
/* Manzara bekatlari (maktab, bekat, bino, ...) — katta rasmli doiralar */
.day-node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;z-index:5}
.poi{position:absolute;transform:translate(-50%,-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:3px}
.poi-btn{width:66px;height:66px;border-radius:50%;border:3px solid #ffffff;background:var(--surface-2);box-shadow:0 5px 12px #0000002e;display:grid;place-items:center;font-size:30px;cursor:pointer;transition:transform .12s}
.poi-btn:active{transform:scale(.94)}
.poi-label{font-size:10px;font-weight:800;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1px 7px;white-space:nowrap;box-shadow:0 2px 6px #00000018}
.poi-link{position:absolute;top:0;height:4px;border-top:3px dashed #bcdcc4}
html[data-theme="dark"] .poi-link{border-top-color:#2d5a3d}
.lock-ic{font-size:22px;line-height:1}
.node-circle{width:58px;height:58px;border-radius:50%;border:4px solid #ffffff;display:grid;place-items:center;font-weight:800;font-size:17px;cursor:pointer;color:#fff;transition:transform .12s;box-shadow:0 6px 14px #0000003d}
.node-circle:active{transform:translateY(2px) scale(.96)}
/* Bajarilgan kun — yashil tugma */
.day-node.done .node-circle{background:linear-gradient(180deg,#41c375 0%,#28a361 60%,#1d8a54 100%)}
/* Navbatdagi kun — ko'k tugma, sariq halqa (rasmdagidek) */
.day-node.current .node-circle{background:linear-gradient(180deg,#3157a4 0%,#24417f 100%);color:#ffd23e;box-shadow:0 0 0 5px #ffd23e, 0 8px 18px #0000004d;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px #ffd23e, 0 8px 18px #0000004d}50%{box-shadow:0 0 0 9px #ffd23e66, 0 8px 18px #0000004d}}
/* Yopiq kunlar — to'q ko'k */
.day-node.locked .node-circle{background:linear-gradient(180deg,#243f7a 0%,#1d3260 100%);color:#fff}
.day-node.done .node-check{font-size:26px}
.day-label{font-size:11px;font-weight:800;color:#8a95ad;white-space:nowrap;text-shadow:0 1px 2px #00000055;margin-top:2px}
.day-node.done .day-label{color:#6fd39a}
.day-node.current .day-label{color:#7fb4ff}
.day-node.locked .day-label{color:#8a95ad}
.check{font-size:20px;line-height:1}

.poi-pop{position:fixed;z-index:100;width:200px;opacity:1;pointer-events:auto;transform:none}
.poi-pop[hidden]{display:none}
.day-pop{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translate(-50%,8px);width:200px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 11px;z-index:30;box-shadow:0 14px 34px #1d2b4b33;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.day-pop::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--surface)}
.day-node.open .day-pop{opacity:1;transform:translate(-50%,0)}
.day-pop b{display:block;font-size:13px;color:var(--blue);font-weight:800}
.day-pop span{display:block;font-size:11px;color:var(--text);margin-top:3px;font-weight:700}
.day-pop small{display:block;font-size:9.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.day-pop .lock-note{display:block;font-size:10.5px;color:#d2453c;font-weight:800;margin-top:5px}

/* ---------- BUGUNGA QAYTISH (pastda, o'rtada) ---------- */
.today-btn{display:flex;align-items:center;gap:9px;height:46px;padding:0 22px;border:0;border-radius:24px;background:#3157a4;color:#fff;font:inherit;font-size:13px;font-weight:800;letter-spacing:.2px;cursor:pointer;box-shadow:0 8px 24px #3157a455;z-index:15;margin:18px auto 4px}
.today-btn:active{transform:scale(.96)}
.today-btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2}

@media (max-width:420px){
  .wrap{padding-left:14px;padding-right:14px}
  .map-wrap{margin-left:-14px;margin-right:-14px}
  .intro b{font-size:20px}
  .intro-grid{gap:12px}
  .ring-wrap{width:74px;height:74px}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="app.html">‹</a>
  <b>91 kunlik sayohat</b>
</header>

<div class="wrap">
  <div class="intro">
    <small>SAYOHAT</small>
    <b>91 kunlik sayohat</b>
    <div class="intro-grid">
      <div class="ring-wrap" aria-hidden="true">
        <svg viewBox="0 0 84 84" width="84" height="84">
          <circle class="ring-bg" cx="42" cy="42" r="34" fill="none" stroke-width="7"/>
          <circle class="ring-fg" id="ringFg" cx="42" cy="42" r="34" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="213.63" stroke-dashoffset="213.63"/>
        </svg>
        <div class="ring-label"><b id="ringPct">0%</b><small>O‘tilgan</small></div>
      </div>
      <div class="intro-stats">
        <div class="stat-box"><small>Hozir</small><b id="currentDay">1-kun</b><span>Navbatdagi dars</span></div>
        <div class="stat-box"><small>O‘tilgan</small><b id="doneCount">0</b><span>91 kundan</span></div>
      </div>
    </div>
  </div>

  <div class="map-wrap" id="mapWrap"></div>

  <button class="today-btn" id="goTodayBtn" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 8v8M8 12h8" /><circle cx="12" cy="12" r="9"/></svg>
    Bugunga qaytish
  </button>
</div>

<script>
const TOTAL_DAYS = 91;
const LESSONS = [
  { de: 'Hallo', uz: 'Salom' },
  { de: 'Wie heißt du?', uz: 'Isming nima?' },
  { de: 'Danke', uz: 'Rahmat' },
  { de: 'das Wasser', uz: 'suv' },
  { de: 'Guten Morgen', uz: 'Xayrli tong' },
  { de: 'die Familie', uz: 'oila' },
  { de: 'gut', uz: 'yaxshi' },
  { de: 'der Kaffee', uz: 'kofe' },
  { de: 'die Frage', uz: 'savol' },
  { de: 'Entschuldigung', uz: 'kechirasiz' },
  { de: 'der Bahnhof', uz: 'stansiya / vokzal' },
  { de: 'das Wetter', uz: 'ob-havo' },
];
/* Manzara bekatlari: maktab, vokzal, bino, qal‘a ... */
const LANDMARKS = {
  2:  { icon: '🏫', de: 'die Schule', uz: 'maktab', cap: 'Ta‘lim muassasasi' },
  4:  { icon: '🚉', de: 'der Bahnhof', uz: 'stansiya', cap: 'Poyezd bekati' },
  6:  { icon: '🏢', de: 'das Gebäude', uz: 'bino', cap: 'Katta bino' },
  9:  { icon: '🏰', de: 'das Schloss', uz: 'qal‘a', cap: 'Neuschwanstein' },
  12: { icon: '⛪', de: 'die Kirche', uz: 'cherkov', cap: 'Gotik sobor' },
  15: { icon: '🌳', de: 'der Park', uz: 'park', cap: 'Yashil park' },
  19: { icon: '🏛️', de: 'das Museum', uz: 'muzey', cap: 'San‘at muzeyi' },
  23: { icon: '🛒', de: 'der Markt', uz: 'bozor', cap: 'Mahalliy bozor' },
  28: { icon: '🌉', de: 'die Brücke', uz: 'ko‘prik', cap: 'Reyn ustidagi Hohenzollernbrücke' },
  34: { icon: '🚄', de: 'der Hauptbahnhof', uz: 'bosh vokzal', cap: 'Katta transport markazi' },
  41: { icon: '⛲', de: 'der Brunnen', uz: 'favvora', cap: 'Shaharning markaziy favvarasi' },
  48: { icon: '🏟️', de: 'das Stadion', uz: 'stadion', cap: 'Futbol maydoni' },
  56: { icon: '🗼', de: 'der Fernsehturm', uz: 'televiziya minorasi', cap: 'Berlin Fernsehturm' },
  67: { icon: '🎠', de: 'der Vergnügungspark', uz: 'attraksionlar bog‘i', cap: 'Oila parki' },
  78: { icon: '🏔️', de: 'die Alpen', uz: 'Alplar tog‘lari', cap: 'Zugspitze — eng baland cho‘qqi' },
};

const wrap = document.getElementById('mapWrap');
const STEP = 104;
const TOP = 30;
const MAP_HEIGHT = TOP + TOTAL_DAYS * STEP + 60;
wrap.style.height = MAP_HEIGHT + 'px';

function nodePoint(i) {
  // 520px koordinata maydoni: yo‘l doimiy kengligi saqlanadi
  const t = i / 6.2;
  const xPx = 260 + Math.sin(t) * 175; // px
  const xPct = (xPx / 520) * 100;
  const y = TOP + i * STEP;
  return { x: xPct, xPx, y };
}

// SVG yo‘li: qalin yumshoq yashil chiziq + kichik nuqta-chiziq
let d = '';
for (let i = 0; i < TOTAL_DAYS; i++) {
  const p = nodePoint(i);
  d += (i === 0 ? 'M' : ' L') + ` ${p.xPx.toFixed(1)} ${p.y.toFixed(1)}`;
}
wrap.innerHTML = `<svg class="map-svg" viewBox="0 0 520 ${MAP_HEIGHT}" preserveAspectRatio="xMidYMin meet" aria-hidden="true">
  <path class="map-path" d="${d}"/>
  <path class="map-path-dots" d="${d}"/>
</svg>`;

let completedDays = [];
let currentDayNumber = 1;

// Bitta umumiy popover — bekat rasmiga bosilganda joyida chiqadi
const poiPop = document.createElement('div');
poiPop.className = 'day-pop poi-pop';
poiPop.setAttribute('role', 'tooltip');
poiPop.hidden = true;
poiPop.innerHTML = '<b></b><span></span><small></small>';
document.body.appendChild(poiPop);

function showPoiPop(ev, lm) {
  poiPop.querySelector('b').textContent = lm.de;
  poiPop.querySelector('span').textContent = '— ' + lm.uz;
  poiPop.querySelector('small').textContent = lm.cap;
  poiPop.hidden = false;
  const rect = ev.currentTarget.getBoundingClientRect();
  poiPop.style.left = rect.left + 'px';
  poiPop.style.top = (rect.top - 12) + 'px';
  poiPop.style.transform = 'translate(-50%,-100%)';
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.poi-btn') && !e.target.closest('.poi-pop')) poiPop.hidden = true;
});

function renderPOIs() {
  wrap.querySelectorAll('.poi').forEach((p) => p.remove());
  // Zik-zak tartibi: 1 ta o'ngda, 2 ta chapda (rasm tartibiga o'xshash)
  const ZIGZAG = [1, -1, -1];
  let idx = 0;
  for (const [dayStr, lm] of Object.entries(LANDMARKS)) {
    const day = Number(dayStr);
    const p = nodePoint(day - 1);
    const side = ZIGZAG[idx % ZIGZAG.length];
    idx++;
    let off = 120;
    // Chegaradan tashqariga chiqib ketmasin
    let poiX = p.xPx + side * off;
    if (poiX > 460) poiX = p.xPx - off;
    else if (poiX < 60) poiX = p.xPx + off;
    poiX = Math.max(40, Math.min(480, poiX));
    const effSide = poiX > p.xPx ? 1 : -1;
    const poi = document.createElement('div');
    poi.className = 'poi';
    poi.style.left = ((poiX / 520) * 100) + '%';
    poi.style.top = p.y + 'px';
    poi.innerHTML = `
      <button class="poi-btn" type="button" aria-label="${lm.de}">${lm.icon}</button>
      <span class="poi-label">${lm.uz}</span>
      <span class="poi-link" style="width:${off - 30}px;left:${effSide === 1 ? 'calc(100% - ' + (off - 30) + 'px)' : '-' + (off - 30) + 'px'}"></span>`;
    poi.querySelector('.poi-btn').addEventListener('click', (ev) => showPoiPop(ev, lm));
    wrap.appendChild(poi);
  }
}

function buildNodes() {
  wrap.querySelectorAll('.day-node').forEach((n) => n.remove());
  for (let day = 1; day <= TOTAL_DAYS; day++) {
    const { x, y } = nodePoint(day - 1);
    const done = completedDays.includes(day);
    const current = day === currentDayNumber && !done;
    const locked = !done && !current;
    const lesson = LESSONS[(day - 1) % LESSONS.length];
    const node = document.createElement('div');
    node.className = 'day-node' + (done ? ' done' : '') + (locked ? ' locked' : '') + (current ? ' current' : '');
    node.style.left = x + '%';
    node.style.top = y + 'px';
    node.dataset.day = day;
    node.innerHTML = `
      <button class="node-circle" type="button" aria-label="${day}-kun">${done ? '<span class="node-check">✓</span>' : current ? day : '<span class="lock-ic">🔒</span>'}</button>
      <span class="day-label">${day}-kun</span>
      <div class="day-pop" role="tooltip">
        <b>${lesson.de}</b>
        <span>— ${lesson.uz}</span>
        <small>${day}-kun${done ? ' · O‘tilgan ✓' : current ? ' · Navbatdagi dars' : ' · Hali ochilmagan'}</small>
        ${locked ? '<span class="lock-note">Hali ochilmagan</span>' : ''}
      </div>`;
    const circle = node.querySelector('.node-circle');
    circle.addEventListener('click', () => {
      // Ochiq kun — bosilganda dars sahifasiga o'tadi
      if (!locked) {
        location.href = 'lesson.html?day=' + day;
        return;
      }
      const willOpen = !node.classList.contains('open');
      wrap.querySelectorAll('.day-node.open').forEach((n) => n.classList.remove('open'));
      if (willOpen) node.classList.add('open');
    });
    wrap.appendChild(node);
  }
  renderPOIs();
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.day-node')) {
    wrap.querySelectorAll('.day-node.open').forEach((n) => n.classList.remove('open'));
  }
});

function paintProgress() {
  const done = completedDays.length;
  const pct = Math.round((done / TOTAL_DAYS) * 100);
  const CIRC = 2 * Math.PI * 34; // ~213.63
  document.getElementById('ringFg').style.strokeDashoffset = String(CIRC * (1 - done / TOTAL_DAYS));
  document.getElementById('ringPct').textContent = pct + '%';
  document.getElementById('currentDay').textContent = '1-kun';
  document.getElementById('doneCount').textContent = done;
}

document.getElementById('goTodayBtn').addEventListener('click', () => {
  const node = wrap.querySelector(`.day-node[data-day="${currentDayNumber}"]`);
  if (node) node.scrollIntoView({ behavior: 'smooth', block: 'center' });
});

(async function initJourney() {
  const me = await guard('student');
  if (!me) return;
  try {
    const data = await authFetch('/api/progress');
    completedDays = Array.isArray(data.completedDays) ? data.completedDays : [];
  } catch { completedDays = []; }
  // Hozircha faqat 1-kun ochiq; qolgan barcha kunlar qulf holatida
  currentDayNumber = 1;
  paintProgress();
  buildNodes();
  // Hozirgi kunga avtomatik aylantiramiz
  setTimeout(() => {
    const node = wrap.querySelector(`.day-node[data-day="${currentDayNumber}"]`);
    if (node) node.scrollIntoView({ block: 'center' });
  }, 120);
})();
</script>
</body>
</html>
